<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#144b88"/>
      <stop offset="70%" stop-color="#0a2a52"/>
      <stop offset="100%" stop-color="#051833"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce282"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997300"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0b0"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#916c04"/>
      <stop offset="100%" stop-color="#e6c35c"/>
    </linearGradient>
  </defs>

  <!-- Outer Cog / Gear / Rope border effect -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="2, 1.8" />
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="45" fill="url(#crestBg)" stroke="url(#goldRing)" stroke-width="3" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Laurel Wreath Left -->
  <g fill="url(#goldGrad)">
    <path d="M 22 52 C 20 45, 23 37, 28 31 C 27 34, 27 37, 29 40 C 27 38, 25 36, 23 33" />
    <path d="M 27 33 C 28 27, 33 22, 38 18 C 36 21, 35 25, 36 28 C 34 26, 31 23, 29 20" />
    <path d="M 37 20 C 40 16, 46 14, 50 14 C 47 16, 45 19, 45 22 C 44 20, 41 18, 38 17" />
    
    <!-- Laurel Wreath Right -->
    <path d="M 78 52 C 80 45, 77 37, 72 31 C 73 34, 73 37, 71 40 C 73 38, 75 36, 77 33" />
    <path d="M 73 33 C 72 27, 67 22, 62 18 C 64 21, 65 25, 64 28 C 66 26, 69 23, 71 20" />
    <path d="M 63 20 C 60 16, 54 14, 50 14 C 53 16, 55 19, 55 22 C 56 20, 59 18, 62 17" />
  </g>

  <!-- Open Book in Center -->
  <g transform="translate(0, 4)">
    <!-- Book pages background -->
    <path d="M 50 42 C 43 38, 32 38, 27 40 L 27 58 C 32 56, 43 56, 50 60 C 57 56, 68 56, 73 58 L 73 40 C 68 38, 57 38, 50 42 Z" 
          fill="#ffffff" stroke="#c0d4ec" stroke-width="1"/>
    
    <!-- Book spine divider -->
    <line x1="50" y1="42" x2="50" y2="60" stroke="#0a2a52" stroke-width="1.8" />
    
    <!-- Book lines left page -->
    <line x1="31" y1="44" x2="46" y2="44" stroke="#0a2a52" stroke-width="0.8" />
    <line x1="31" y1="48" x2="46" y2="48" stroke="#0a2a52" stroke-width="0.8" />
    <line x1="31" y1="52" x2="46" y2="52" stroke="#0a2a52" stroke-width="0.8" />

    <!-- Book lines right page -->
    <line x1="54" y1="44" x2="69" y2="44" stroke="#0a2a52" stroke-width="0.8" />
    <line x1="54" y1="48" x2="69" y2="48" stroke="#0a2a52" stroke-width="0.8" />
    <line x1="54" y1="52" x2="69" y2="52" stroke="#0a2a52" stroke-width="0.8" />
  </g>

  <!-- Torch / Star Flame on top of book -->
  <path d="M 50 28 Q 47 34 50 38 Q 53 34 50 28 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="39" r="1.5" fill="#fdf0b0" />

  <!-- Banner Ribbon at Bottom -->
  <path d="M 22 69 L 30 65 L 70 65 L 78 69 L 75 76 L 68 73 L 50 75 L 32 73 L 25 76 Z" 
        fill="#081e3a" stroke="url(#goldRing)" stroke-width="1.5" />
  <text x="50" y="73" font-family="'Arial', sans-serif" font-weight="900" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">NCTMS</text>
  
  <!-- Tiny bottom text "INDIA" -->
  <text x="50" y="82" font-family="'Arial', sans-serif" font-weight="bold" font-size="4.5" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">INDIA</text>
</svg>
