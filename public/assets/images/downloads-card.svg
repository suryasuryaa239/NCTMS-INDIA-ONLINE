<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf4ff" />
      <stop offset="100%" stop-color="#d6e8fe" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0984e3" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#023e8a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" fill="url(#bgGrad)" />

  <!-- Document Sheet -->
  <g transform="translate(135, 45)" filter="url(#shadow)">
    <!-- Folded Paper Path -->
    <path d="M 10 0 L 95 0 L 125 30 L 125 180 C 125 186, 120 190, 114 190 L 10 190 C 4 190, 0 186, 0 180 L 0 10 C 0 4, 4 0, 10 0 Z" fill="url(#docGrad)" />
    
    <!-- Paper Fold Corner -->
    <path d="M 95 0 L 95 30 L 125 30 Z" fill="#74b9ff" opacity="0.9" />

    <!-- Content Lines -->
    <rect x="25" y="55" width="75" height="10" rx="5" fill="#ffffff" opacity="0.95" />
    <rect x="25" y="80" width="60" height="10" rx="5" fill="#ffffff" opacity="0.95" />
    <rect x="25" y="105" width="75" height="10" rx="5" fill="#ffffff" opacity="0.95" />
    <rect x="25" y="130" width="45" height="10" rx="5" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
